[package]
name = "crytles-lock"
version = "0.1.0"
description = "Token locks for crytles.com"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "crytles_lock"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.2", features = ["init-if-needed"] }
anchor-spl = "1.2.2"
